{% set name = "gars_field" %}
{% set version = "0.3.4" %}
{% set python_min = "3.13" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8957cd98ec9a1aa1e1f5b9397cce2979ff307c7b5bc43f005a8d6968748331a1

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - shapely
    - pyproj >=3.0.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - gars_field

about:
  home: https://github.com/corteva/gars-field
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Toolkit to generate Global Area Reference System grids.
  description: |
    Toolkit to generate Global Area Reference System grids. 
  doc_url: https://github.com/corteva/gars-field
  dev_url: https://github.com/corteva/gars-field

extra:
  recipe-maintainers:
    - snowman2
